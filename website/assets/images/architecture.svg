<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">EnergyCast data and forecasting architecture</title>
  <desc id="desc">Public electricity and weather sources flow through validated acquisition, canonical Parquet, geographic and temporal features, rolling-origin model evaluation, a frozen V1 bundle, and guarded production outputs.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#102947"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7087a3"/></marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg2)"/>
  <text x="60" y="56" fill="#7f96b2" font-family="DM Mono, monospace" font-size="14" letter-spacing="2">ENERGYCAST AI · DATA TO DETERMINISTIC INFERENCE</text>
  <g fill="none" stroke="#7087a3" stroke-width="3" marker-end="url(#a)">
    <path d="M250 176 H306"/><path d="M530 176 H586"/><path d="M810 176 H866"/>
    <path d="M998 244 V300 H785"/><path d="M667 356 H544"/><path d="M426 356 H303"/>
    <path d="M185 412 V486"/><path d="M310 548 H410"/><path d="M694 548 H794"/>
  </g>
  <g filter="url(#s)" font-family="Manrope, sans-serif">
    <g><rect x="58" y="104" width="192" height="144" rx="16" fill="#102238" stroke="#43dfd1"/><text x="86" y="140" fill="#43dfd1" font-family="DM Mono, monospace" font-size="12">01 · SOURCES</text><text x="86" y="177" fill="#f3f7ff" font-weight="700" font-size="21">Public data</text><text x="86" y="207" fill="#a8b9ce" font-size="14">ERCOT · EIA · ERA5</text><text x="86" y="229" fill="#a8b9ce" font-size="14">SEAS5 · NCEP · FRED</text></g>
    <g><rect x="306" y="104" width="224" height="144" rx="16" fill="#102238" stroke="#68a0ff"/><text x="334" y="140" fill="#68a0ff" font-family="DM Mono, monospace" font-size="12">02 · ACQUIRE</text><text x="334" y="177" fill="#f3f7ff" font-weight="700" font-size="21">Validated cache</text><text x="334" y="207" fill="#a8b9ce" font-size="14">Signatures · schemas</text><text x="334" y="229" fill="#a8b9ce" font-size="14">Checksums · provenance</text></g>
    <g><rect x="586" y="104" width="224" height="144" rx="16" fill="#102238" stroke="#ff9f6d"/><text x="614" y="140" fill="#ff9f6d" font-family="DM Mono, monospace" font-size="12">03 · NORMALIZE</text><text x="614" y="177" fill="#f3f7ff" font-weight="700" font-size="21">Canonical Parquet</text><text x="614" y="207" fill="#a8b9ce" font-size="14">Hourly · daily · monthly</text><text x="614" y="229" fill="#a8b9ce" font-size="14">Units · UTC · local time</text></g>
    <g><rect x="866" y="104" width="276" height="144" rx="16" fill="#102238" stroke="#8d76f8"/><text x="894" y="140" fill="#a797ff" font-family="DM Mono, monospace" font-size="12">04 · MAP + FEATURE</text><text x="894" y="177" fill="#f3f7ff" font-weight="700" font-size="21">Leakage-safe features</text><text x="894" y="207" fill="#a8b9ce" font-size="14">8 zones + system</text><text x="894" y="229" fill="#a8b9ce" font-size="14">Cutoffs · availability · lags</text></g>
    <g><rect x="667" y="300" width="236" height="112" rx="16" fill="#0d1d31" stroke="#43dfd1"/><text x="695" y="337" fill="#43dfd1" font-family="DM Mono, monospace" font-size="12">05 · EVALUATE</text><text x="695" y="372" fill="#f3f7ff" font-weight="700" font-size="20">Rolling origins 1–12</text><text x="695" y="397" fill="#a8b9ce" font-size="13">Identical observations</text></g>
    <g><rect x="426" y="300" width="236" height="112" rx="16" fill="#0d1d31" stroke="#68a0ff"/><text x="454" y="337" fill="#68a0ff" font-family="DM Mono, monospace" font-size="12">06 · COMPARE</text><text x="454" y="372" fill="#f3f7ff" font-weight="700" font-size="20">Statistical → AI</text><text x="454" y="397" fill="#a8b9ce" font-size="13">HW · LGBM · TFT · Chronos</text></g>
    <g><rect x="185" y="300" width="236" height="112" rx="16" fill="#0d1d31" stroke="#ff9f6d"/><text x="213" y="337" fill="#ff9f6d" font-family="DM Mono, monospace" font-size="12">07 · SELECT</text><text x="213" y="372" fill="#f3f7ff" font-weight="700" font-size="20">Development only</text><text x="213" y="397" fill="#a8b9ce" font-size="13">Frozen E14 + E24-B</text></g>
    <g><rect x="58" y="486" width="252" height="124" rx="16" fill="#102238" stroke="#43dfd1"/><text x="86" y="524" fill="#43dfd1" font-family="DM Mono, monospace" font-size="12">08 · FREEZE</text><text x="86" y="561" fill="#f3f7ff" font-weight="700" font-size="21">V1 fitted bundle</text><text x="86" y="588" fill="#a8b9ce" font-size="14">10 artifacts · SHA-256</text></g>
    <g><rect x="410" y="486" width="284" height="124" rx="16" fill="#102238" stroke="#68a0ff"/><text x="438" y="524" fill="#68a0ff" font-family="DM Mono, monospace" font-size="12">09 · GUARD</text><text x="438" y="561" fill="#f3f7ff" font-weight="700" font-size="21">Deterministic inference</text><text x="438" y="588" fill="#a8b9ce" font-size="14">Validate · history · rollback</text></g>
    <g><rect x="794" y="486" width="348" height="124" rx="16" fill="#102238" stroke="#ff9f6d"/><text x="822" y="524" fill="#ff9f6d" font-family="DM Mono, monospace" font-size="12">10 · CONTROL</text><text x="822" y="561" fill="#f3f7ff" font-weight="700" font-size="21">216 forecasts / run</text><text x="822" y="588" fill="#a8b9ce" font-size="14">No live publish · schedule disabled</text></g>
  </g>
  <text x="60" y="670" fill="#7289a5" font-family="DM Mono, monospace" font-size="13">Provenance and forecast-origin availability are preserved across every boundary</text>
</svg>
